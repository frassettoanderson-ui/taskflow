<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Controle do Sorteio OX</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0e1013">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e11d2e;--line:#3a414a;--mute:#8d96a1;--gold:#f4c542;--disp:'Big Shoulders Display',Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0e1013;color:#f2f3f5;font-family:'Archivo',Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 16px 40px;
  background:radial-gradient(ellipse at 50% 0%,#232930,#0e1013 70%)}
.w{width:min(460px,100%);display:flex;flex-direction:column;gap:12px}
h1{font:900 44px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:0;text-align:center}
h1 b{color:var(--red)}
.st{display:flex;align-items:center;justify-content:center;gap:10px;font:800 13px 'Archivo',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;background:#555}
.on .dot{background:#34d058;box-shadow:0 0 10px #34d058}
.info{border:2px solid var(--line);background:#12151a;padding:12px 14px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.info .e{font:800 12px 'Archivo',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--red)}
.info .t{font:900 28px/1.05 var(--disp);letter-spacing:.03em;text-transform:uppercase}
button{border:0;border-radius:0;color:#fff;cursor:pointer;font:900 24px var(--disp);letter-spacing:.1em;text-transform:uppercase;padding:18px 10px;background:#262b31;border:2px solid var(--line)}
button:active:not(:disabled){filter:brightness(1.3);transform:scale(.98)}
button:disabled{opacity:.35;cursor:default}
#play{background:var(--red);border-color:var(--red);font-size:44px;padding:30px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{display:block;font:600 12px 'Archivo',sans-serif;letter-spacing:.08em;color:#c9d0d8;margin-top:3px;text-transform:none}
#aovivo{background:#1d3b26;border-color:#34d058;font-size:30px;margin-top:6px}
.av{border:2px solid #2b5236;padding:10px 14px;font:600 14px/1.5 'Archivo',sans-serif;color:#c9d0d8}
.av b{color:#34d058}
#reset{background:transparent;border-color:var(--red);color:#ff6b78;margin-top:10px}
.win{border:2px solid var(--line);padding:10px 14px;font:600 14px/1.5 'Archivo',sans-serif;color:#c9d0d8}
.win b{color:var(--gold)}
#msg{min-height:18px;font:600 14px 'Archivo',sans-serif;color:var(--mute);text-align:center}
.dica{margin-top:-4px;font:600 12px/1.4 'Archivo',sans-serif;color:var(--mute);text-align:center}
#part{background:#1b2230;border-color:#5b7bb5;font-size:28px}
#pp{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:flex;justify-content:center;align-items:stretch;padding:12px}
#pp[hidden]{display:none}
.pp__in{width:min(520px,100%);display:flex;flex-direction:column;gap:10px;background:#12151a;border:2px solid var(--line);padding:14px}
.pp__topo{display:flex;align-items:center;justify-content:space-between}
.pp__topo h2{margin:0;font:900 32px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em}
#ppx{padding:4px 14px;font-size:30px;line-height:1}
.pp__res{font:600 13px 'Archivo',sans-serif;color:var(--mute);text-align:center}
.pp__res b{color:#f2f3f5}
#ppbusca{height:46px;padding:0 12px;background:#0e1013;border:2px solid var(--line);color:#fff;font:600 16px 'Archivo',sans-serif}
.pp__lista{flex:1;overflow-y:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pp__it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid #22272e;font:600 15px 'Archivo',sans-serif}
.pp__it small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pp__it.ganhou small{color:var(--gold)}
.pp__it.excl{opacity:.55}
.pp__it.excl span{text-decoration:line-through}
.pp__it button{flex:none;padding:8px 12px;font:800 13px 'Archivo',sans-serif;letter-spacing:.06em;background:transparent;border:2px solid var(--red);color:#ff6b78}
.pp__it.excl button{border-color:#34d058;color:#34d058}
.pp__sec{padding:10px 4px 4px;font:800 11px 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div class="w">
  <h1>Sorteio <b>OX</b></h1>
  <div class="st" id="st"><span class="dot"></span><span id="sttxt">Verificando…</span></div>

  <div class="info"><div class="e" id="eb">&nbsp;</div><div class="t" id="tt">—</div></div>

  <button id="play" disabled>Sorteio geral</button>
  <div class="dica">Busca na hora todos os alunos ativos da EVO e sorteia 1 (quem já ganhou e quem foi excluído ficam de fora). Roda sozinho, no automático.</div>

  <button id="aovivo" disabled>Sorteio ao vivo<span class="sub">sorteia 1 entre quem está treinando agora</span></button>

  <button id="part">Participantes<span class="sub" id="partTxt">alunos ativos · ver lista e excluir alguém</span></button>

  <div class="g2">
    <button id="mute">Som<span class="sub" id="muteTxt">ligado</span></button>
    <button id="fullscreen">Tela cheia<span class="sub">se não abrir: F11 no PC</span></button>
  </div>
  <div class="g2">
    <button id="next" disabled>Avançar<span class="sub">pular a espera</span></button>
    <button id="home">Voltar ao início</button>
  </div>
  <div class="av" id="av" hidden></div>

  <div class="win" id="win" hidden></div>
  <button id="reset">Reiniciar tudo do zero</button>
  <div id="msg"></div>
</div>

<div id="pp" hidden>
  <div class="pp__in">
    <div class="pp__topo"><h2>Participantes</h2><button id="ppx" aria-label="Fechar">×</button></div>
    <div class="pp__res" id="ppres">Carregando…</div>
    <input id="ppbusca" type="search" placeholder="Buscar nome…" autocomplete="off">
    <div class="pp__lista" id="pplista"></div>
  </div>
</div>

<script>
const K=new URLSearchParams(location.search).get('k')||'';
const $=s=>document.querySelector(s);
let S={aovivo:{ganhadores:[]},status:'idle',telao:false,muted:false,manual:false,title:'',eyebrow:'',winners:[]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const on=S.telao&&!!K;
  $('#st').classList.toggle('on',S.telao);
  $('#sttxt').textContent=S.telao?'Telão conectado':'Telão desconectado';
  $('#eb').innerHTML=S.telao&&S.eyebrow?esc(S.eyebrow):'&nbsp;';
  $('#tt').textContent=!S.telao?'—':(S.title||(S.status==='idle'?'Pronto para iniciar':'—'));
  const p=$('#play');
  if(!K){p.disabled=true;p.textContent='Link sem chave'}
  else if(!S.telao){p.disabled=true;p.textContent='Aguardando telão'}
  else if(S.status==='running'){p.disabled=true;p.textContent='Sorteando…'}
  else if(buscandoGeral){p.disabled=true;p.textContent='Buscando alunos…'}
  else{p.disabled=false;p.textContent=S.status==='finished'?'Novo sorteio geral':'Sorteio geral'}
  $('#next').disabled=!(on&&S.status==='running');
  ['mute','fullscreen','home','reset'].forEach(id=>$('#'+id).disabled=!on);
  $('#aovivo').disabled=!on||S.status==='running'||aguardandoAoVivo;
  const av=$('#av'),A=S.aovivo||{ganhadores:[]};
  av.hidden=!(A.ganhadores.length||A.ultimo);
  if(!av.hidden)av.innerHTML=(A.ultimo?'Último ao vivo ('+esc(A.ultimo.hora)+'): '+A.ultimo.treinando+' treinando, '+A.ultimo.elegiveis+' concorrendo<br>':'')+(A.ganhadores.length?'<b>Ganharam ao vivo hoje ('+A.ganhadores.length+'):</b> '+A.ganhadores.map(g=>esc(g.nome)+' '+esc(g.hora)).join(', '):'');
  $('#muteTxt').textContent=S.muted?'desligado':'ligado';
  const w=$('#win');
  w.hidden=!(S.telao&&S.winners.length);
  if(!w.hidden)w.innerHTML='<b>Já ganharam ('+S.winners.length+'):</b> '+S.winners.map(esc).join(', ');
}
async function refresh(){
  try{S=Object.assign({telao:false,winners:[]},await(await fetch('../api/state',{cache:'no-store'})).json())}catch(e){S.telao=false}
  render();
}
async function send(c){
  $('#msg').textContent='';
  try{
    const r=await fetch('../api/cmd?c='+c+'&k='+encodeURIComponent(K),{method:'POST'});
    const d=await r.json();
    if(r.status===403)$('#msg').textContent='Chave inválida: use o link completo.';
    else if(d.ok===0)$('#msg').textContent='Aguarde um instante…';
    else if(navigator.vibrate)navigator.vibrate(50);
  }catch(e){$('#msg').textContent='Sem conexão.'}
  setTimeout(refresh,500);
}
['next','mute','fullscreen','home'].forEach(c=>$('#'+c).onclick=()=>send(c));
let buscandoGeral=false;
$('#play').onclick=async()=>{
  if(!confirm('Fazer o sorteio geral agora?\n\nBusca todos os alunos ativos da EVO e sorteia 1. Quem já ganhou e quem foi excluído ficam de fora.'))return;
  buscandoGeral=true;render();$('#msg').textContent='Buscando os alunos ativos na EVO…';
  try{
    const r=await fetch('../api/cmd?c=geral&k='+encodeURIComponent(K),{method:'POST'});const d=await r.json();
    if(r.status===403)$('#msg').textContent='Chave inválida: use o link completo.';
    else if(d.ok===0)$('#msg').textContent=d.motivo||'Aguarde um instante…';
    else $('#msg').textContent=d.ativos+' alunos ativos · '+d.elegiveis+' concorrendo';
  }catch(e){$('#msg').textContent='Sem conexão.'}
  buscandoGeral=false;setTimeout(refresh,500);
};
/* Participantes: lista do sorteio geral; excluir / voltar alguém */
let PP={lista:[],excluidos:[]};
async function carregarPP(){
  $('#ppres').textContent='Buscando os alunos ativos na EVO…';
  try{const r=await fetch('../api/participantes?k='+encodeURIComponent(K),{cache:'no-store'});if(r.status===403){$('#ppres').textContent='Chave inválida: use o link completo.';return}const d=await r.json();if(!r.ok){$('#ppres').textContent=d.error||'Falha ao buscar.';return}PP=d}catch(e){$('#ppres').textContent='Sem conexão.';return}
  $('#partTxt').textContent=PP.concorrendo+' concorrendo de '+PP.total;
  desenharPP();
}
function desenharPP(){
  const q=$('#ppbusca').value.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
  const ok=n=>!q||n.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').includes(q);
  const ganh=PP.lista.filter(x=>x.ganhou).length,exc=PP.lista.filter(x=>x.excluido).length;
  $('#ppres').innerHTML='<b>'+PP.concorrendo+'</b> concorrendo · '+PP.total+' alunos ativos na EVO · '+ganh+' já ganharam · '+exc+' excluídos'+(PP.foraDaRegra?' · '+PP.foraDaRegra+' só Weekend Fun/VIP (fora)':'');
  const item=x=>'<div class="pp__it'+(x.excluido?' excl':'')+(x.ganhou?' ganhou':'')+'"><div><span>'+esc(x.nome)+'</span>'+(x.excluido?'<small>excluído</small>':x.ganhou?'<small>já ganhou</small>':'<small>'+esc(x.plano||'')+'</small>')+'</div>'+
    '<button data-n="'+esc(x.nome)+'" data-a="'+(x.excluido?'restaurar':'excluir')+'">'+(x.excluido?'Voltar':'Excluir')+'</button></div>';
  const fora=PP.lista.filter(x=>x.excluido&&ok(x.nome)),dentro=PP.lista.filter(x=>!x.excluido&&ok(x.nome));
  $('#pplista').innerHTML=(dentro.length?dentro.map(item).join(''):'<div class="pp__sec">Ninguém com esse nome</div>')+(fora.length?'<div class="pp__sec">Excluídos</div>'+fora.map(item).join(''):'');
}
$('#part').onclick=()=>{$('#pp').hidden=false;$('#ppbusca').value='';carregarPP()};
$('#ppx').onclick=()=>{$('#pp').hidden=true};
$('#ppbusca').oninput=desenharPP;
$('#pplista').onclick=async e=>{
  const b=e.target.closest('button[data-n]');if(!b)return;
  const n=b.dataset.n,a=b.dataset.a;
  if(a==='excluir'&&!confirm('Excluir '+n+' do sorteio?\n\nA pessoa deixa de concorrer no sorteio geral e no ao vivo. Dá para voltar depois.'))return;
  b.disabled=true;
  try{await fetch('../api/'+a+'?nome='+encodeURIComponent(n)+'&k='+encodeURIComponent(K),{method:'POST'});if(navigator.vibrate)navigator.vibrate(40)}catch(e){}
  carregarPP();
};
let aguardandoAoVivo=false;
$('#aovivo').onclick=async()=>{
  if(!confirm('Fazer um sorteio ao vivo agora?\n\nSorteia 1 brinde entre quem está treinando neste momento (pela catraca). O grande sorteio não é afetado.'))return;
  aguardandoAoVivo=true;render();$('#msg').textContent='Consultando a catraca…';
  try{
    const r=await fetch('../api/cmd?c=aovivo&k='+encodeURIComponent(K),{method:'POST'});const d=await r.json();
    if(r.status===403)$('#msg').textContent='Chave inválida: use o link completo.';
    else if(d.ok===0)$('#msg').textContent=d.motivo||'Aguarde um instante…';
    else $('#msg').textContent=d.treinando+' treinando agora · '+d.elegiveis+' concorrendo';
  }catch(e){$('#msg').textContent='Sem conexão.'}
  aguardandoAoVivo=false;setTimeout(refresh,500);
};
$('#reset').onclick=()=>{if(confirm('Reiniciar tudo do zero?\n\nLimpa a lista de quem já ganhou, recarrega a lista de clientes e volta ao início.'))send('reset')};
refresh();setInterval(refresh,1500);
</script>
</body>
</html>
