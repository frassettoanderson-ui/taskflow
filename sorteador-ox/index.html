<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sorteio OX</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1013; --steel:#1b1f24; --steel2:#2a3037; --line:#3a414a;
  --red:#e11d2e; --ember:#ff5a1f; --gold:#f4c542; --txt:#f2f3f5; --mute:#6b7480;
  --disp:'Big Shoulders Display','Arial Narrow Bold',Impact,sans-serif;
  --body:'Archivo',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#08090b;color:var(--txt);font-family:var(--body);overflow:hidden}
body.idle{cursor:none}

/* ---------- setup ---------- */
#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 50% 0%,#232930,#0e1013 70%);z-index:50;overflow:auto}
.box{width:min(760px,100%);background:var(--steel);border:2px solid var(--line);position:relative;padding:44px 40px 32px}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 10px,transparent 10px 20px)}
.box h1{font:900 64px/1 var(--disp);letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase;text-align:center}
.box h1 b{color:var(--red)}
.box p.sub{margin:0 0 26px;color:var(--mute);text-align:center;font-size:15px}
label{display:block;font:800 13px var(--body);letter-spacing:.18em;text-transform:uppercase;color:#9aa3ad;margin:16px 0 6px}
textarea,input[type=text]{width:100%;background:#12151a;border:2px solid var(--line);color:#fff;font:600 17px var(--body);padding:12px 14px;outline:none;border-radius:0}
textarea{height:260px;resize:vertical;line-height:1.5}
textarea:focus,input[type=text]:focus{border-color:var(--red)}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.cnt{font:800 22px var(--disp);letter-spacing:.06em;color:#9aa3ad}
.cnt b{color:#fff}
.chk{display:flex;gap:8px;align-items:center;font:600 14px var(--body);color:#9aa3ad;text-transform:none;letter-spacing:0;margin:0}
button{font:900 22px var(--disp);letter-spacing:.12em;text-transform:uppercase;border:0;cursor:pointer;border-radius:0;padding:14px 26px;color:#fff;background:var(--red)}
button:hover{filter:brightness(1.12)}
button.ghost{background:transparent;border:2px solid var(--line);color:#c9d0d8;font-size:16px;padding:10px 16px}
.go{width:100%;margin-top:22px;font-size:34px;padding:18px}
.keys{margin-top:18px;color:var(--mute);font-size:13px;text-align:center;line-height:1.7}
.keys kbd{background:#12151a;border:1px solid var(--line);padding:1px 7px;color:#c9d0d8;font:700 12px var(--body)}

/* ---------- stage ---------- */
#stage{position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#222831 0%,#14171b 55%,#0a0b0d 100%)}
#stage canvas{position:absolute;left:0;top:0;pointer-events:none}
#fx{z-index:30}
#grid{position:absolute;inset:0;opacity:.05;
  background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 96px),repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 96px)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65));pointer-events:none;z-index:25}
#beams{position:absolute;left:50%;top:55%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;opacity:0;transition:opacity 1.2s;
  background:repeating-conic-gradient(from 0deg,rgba(244,197,66,.22) 0 6deg,transparent 6deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 5%,transparent 62%);mask:radial-gradient(circle,#000 5%,transparent 62%);
  animation:spin 26s linear infinite;z-index:1}
#beams.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

#topbar{position:absolute;left:0;right:0;top:0;height:34px;background:var(--red);z-index:5;
  clip-path:polygon(0 0,100% 0,100% 55%,calc(100% - 20px) 100%,calc(100% - 40px) 55%,calc(100% - 60px) 100%);}
#topbar{--t:40px;
  -webkit-mask:linear-gradient(#000,#000);
  clip-path:none;
  background:
    linear-gradient(135deg,transparent 50%,var(--red) 50%) 0 100%/28px 14px repeat-x,
    linear-gradient(225deg,transparent 50%,var(--red) 50%) 14px 100%/28px 14px repeat-x;
  height:34px}
#topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:20px;background:var(--red)}
#brand{position:absolute;top:2px;left:44px;font:900 17px var(--disp);letter-spacing:.35em;z-index:6;color:#fff;line-height:20px}
#eyebrow{position:absolute;top:64px;left:0;right:0;text-align:center;font:800 30px var(--body);letter-spacing:.5em;text-transform:uppercase;color:var(--red);z-index:6}
#title{position:absolute;top:106px;left:0;right:0;text-align:center;font:900 112px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;z-index:6;
  text-shadow:0 6px 40px rgba(0,0,0,.6)}
.swap{animation:swap .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes swap{from{opacity:0;transform:translateY(-30px) scale(1.08);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

#roller{position:absolute;left:50%;top:226px;width:880px;height:104px;margin-left:-440px;z-index:8;display:none;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#14171b,#1f242a);border:2px solid var(--red);box-shadow:0 0 50px rgba(225,29,46,.35)}
#roller.on{display:flex}
#roller span{font:900 70px/1 var(--disp);text-transform:uppercase;white-space:nowrap;color:#fff;letter-spacing:.03em}

#cards{position:absolute;inset:0;z-index:10}
.card{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,var(--steel2),var(--steel));border:2px solid var(--line);
  transition:left .9s cubic-bezier(.7,0,.2,1),top .9s cubic-bezier(.7,0,.2,1),width .9s cubic-bezier(.7,0,.2,1),height .9s cubic-bezier(.7,0,.2,1),transform .22s,box-shadow .22s,border-color .22s,background .22s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(-45deg,var(--red) 0 8px,transparent 8px 16px);opacity:.9}
.card .num{position:absolute;left:18px;bottom:12px;font:800 26px var(--disp);color:var(--mute);letter-spacing:.1em}
.card .nm{font-family:var(--disp);font-weight:900;text-transform:uppercase;line-height:.95;padding:0 18px;white-space:pre-line;color:#fff;font-size:80px;transition:font-size .9s cubic-bezier(.7,0,.2,1)}
.card.empty .nm::after{content:"?";color:#3a414a}
.card.in{animation:pop .32s cubic-bezier(.5,0,.9,.4)}
@keyframes pop{0%{transform:scale(1.4);filter:brightness(3);opacity:0}35%{opacity:1}100%{transform:scale(1);filter:none}}
.card.spot{border-color:var(--red);background:linear-gradient(180deg,#5a1f26,#2a1014);transform:scale(1.07);z-index:4;
  box-shadow:0 0 0 5px rgba(225,29,46,.4),0 0 70px rgba(225,29,46,.8)}
.card.hit{animation:hit .42s linear;border-color:#fff;background:#b0121f}
@keyframes hit{0%,100%{translate:0}15%{translate:-18px}35%{translate:16px}55%{translate:-10px}75%{translate:8px}}
.card.out{transform:translateY(520px) rotate(9deg) scale(.82)!important;opacity:0;filter:grayscale(1) brightness(.55);
  transition:transform 1s cubic-bezier(.5,0,1,.7),opacity .9s ease-in .1s,filter .3s!important;box-shadow:none}
.card.win{border-color:var(--gold);background:linear-gradient(180deg,#42371a,#1b1608);z-index:12;box-shadow:0 0 140px rgba(244,197,66,.55)}
.card.win::before{background:repeating-linear-gradient(-45deg,var(--gold) 0 8px,transparent 8px 16px)}
.card.win .nm{color:var(--gold);text-shadow:0 0 40px rgba(244,197,66,.5)}
.card.win .num{display:none}
.tag{position:absolute;left:0;right:0;top:34px;text-align:center;font:800 30px var(--body);letter-spacing:.5em;color:#fff;display:none}
.card.win .tag{display:block}
.fly{position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#14171b,#1f242a);border:2px solid var(--red);
  font:900 64px/1 var(--disp);text-transform:uppercase;color:#fff;white-space:nowrap;box-shadow:0 0 50px rgba(225,29,46,.6)}

#splash{position:absolute;inset:0;z-index:22;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center,rgba(20,23,27,.55),rgba(8,9,11,.95));transition:opacity .8s}
#splash.off{opacity:0;pointer-events:none}
#splash .s1{font:800 34px var(--body);letter-spacing:.6em;color:var(--red);margin-right:-.6em}
#splash .s2{font:900 330px/.9 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:6px 0}
#splash .s3{font:800 52px var(--disp);letter-spacing:.3em;text-transform:uppercase;color:#aab3bd;margin-right:-.3em}
#splash.in .s1{animation:swap .8s .1s both}
#splash.in .s2{animation:slam .9s .35s cubic-bezier(.2,1.2,.3,1) both}
#splash.in .s3{animation:swap .8s .9s both}
@keyframes slam{from{opacity:0;transform:scale(2.6);filter:blur(24px)}to{opacity:1;transform:none;filter:none}}

#hint{position:absolute;left:0;right:0;bottom:34px;text-align:center;font:700 24px var(--body);letter-spacing:.35em;text-transform:uppercase;color:#7c8591;z-index:9;opacity:0;transition:opacity .4s}
#hint.on{opacity:1;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.press{position:absolute;z-index:14;background:linear-gradient(180deg,#5b636d,#2e343b 55%,#1d2126);border:3px solid #6f7782;box-shadow:0 24px 60px rgba(0,0,0,.65)}
.press::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,#111 10px 20px)}
.blade{position:absolute;z-index:15;pointer-events:none;background:linear-gradient(90deg,transparent,#fff 12%,#fff 88%,transparent);box-shadow:0 0 30px 8px rgba(255,255,255,.9),0 0 90px 22px rgba(225,29,46,.6)}
.crack{position:absolute;inset:0;pointer-events:none}
.crack svg{width:100%;height:100%}
.crack path{fill:none;stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px rgba(225,29,46,.95))}
.arm{position:absolute;z-index:15;pointer-events:none;filter:drop-shadow(0 40px 50px rgba(0,0,0,.7))}
.arm img{width:100%;height:100%;display:block}
.card.mini{border-width:1px}
.card.mini::before{height:3px}
.card.mini .num{display:none}
.card.mini .nm{padding:0 3px;line-height:1;font-weight:800}
.card.poolin{animation:poolIn .4s both;animation-delay:calc(var(--i)*3ms)}
@keyframes poolIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.card.frame{outline:3px solid var(--red);outline-offset:1px;background:linear-gradient(180deg,#5a1f26,#2a1014);z-index:3}
.card.locked{outline:4px solid var(--gold);outline-offset:2px;background:linear-gradient(180deg,#5b4a16,#2a2008);z-index:6;transform:scale(1.35);box-shadow:0 0 30px rgba(244,197,66,.7)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
.ring{position:absolute;border:8px solid var(--gold);border-radius:50%;z-index:11;pointer-events:none}
#toast{position:fixed;right:18px;bottom:14px;z-index:99;font:700 14px var(--body);color:#fff;background:rgba(0,0,0,.7);padding:6px 12px;opacity:0;transition:opacity .3s}
</style>
</head>
<body>

<!-- ============ CONFIGURAÇÃO ============ -->
<div id="setup">
  <div class="box">
    <h1>Sorteio <b>OX</b></h1>
    <p class="sub">10 nomes → 5 → 3 → 1 vencedor, com animação e efeitos sonoros para o telão.</p>

    <label for="prize">Título do sorteio / prêmio</label>
    <input type="text" id="prize" placeholder="Ex.: 1 ano de plano OX">

    <label for="names">Participantes (um por linha)</label>
    <textarea id="names" placeholder="Maria Silva&#10;João Souza&#10;..."></textarea>

    <div class="row">
      <div class="cnt"><b id="count">0</b> participantes</div>
      <label class="chk"><input type="checkbox" id="auto"> Modo automático (avança sozinho)</label>
      <span><button class="ghost" id="sample" type="button">Exemplo 24</button> <button class="ghost" id="sample300" type="button">Exemplo 300</button></span>
    </div>

    <button class="go" id="go">Iniciar em tela cheia</button>
    <div class="keys"><kbd>Espaço</kbd> / clique avança · <kbd>M</kbd> som · <kbd>F</kbd> tela cheia · <kbd>Esc</kbd> volta a esta tela</div>
  </div>
</div>

<!-- ============ PALCO ============ -->
<div id="stage" hidden>
  <canvas id="bg"></canvas>
  <div id="grid"></div>
  <div id="beams"></div>
  <div id="topbar"></div><div id="brand">OX</div>
  <div id="eyebrow"></div>
  <div id="title"></div>
  <div id="roller"><span></span></div>
  <div id="cards"></div>
  <div id="hint"></div>
  <canvas id="fx"></canvas>
  <div id="vig"></div>
  <div id="splash"><div class="s1">OX</div><div class="s2">Sorteio</div><div class="s3" id="splashPrize"></div></div>
  <div id="flash"></div>
</div>
<div id="toast"></div>

<script>
/* =====================================================================
   Sorteio OX — tela de 1920x1080 por padrão. Para outro formato:
   index.html?w=3840&h=1080   (o palco escala para caber no telão)
   ===================================================================== */
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);
const W=+Q.get('w')||1920, H=+Q.get('h')||1080, U=H/1080;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- aleatoriedade (criptográfica, sem viés) ---------- */
function rnd(n){const b=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(b);x=b[0]}while(x>=lim);return x%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- som (tudo sintetizado, sem arquivos) ---------- */
let ac,master,noiseBuf,muted=false;
function initAudio(){
  if(ac){ac.resume();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=.85;
  master.connect(comp);comp.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function osc(type,f0,f1,t,dur,vol,lp){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,.006,vol,dur);let n=o;
  if(lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f}
  n.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.08);
}
function noise(t,dur,vol,type,f0,f1,q=1,a){
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ac.createGain();env(g,t,a??Math.min(.02,dur/3),vol,dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.08);
}
function clank(t,f,vol,dur){[1,2.76,5.4,8.93].forEach((m,i)=>osc('sine',f*m,f*m*.992,t,dur/(1+i*.7),vol/(1+i*.9)))}
function click(t,v=.3){noise(t,.03,v,'bandpass',3200,2200,2,.002);osc('triangle',190,90,t,.045,v)}
const S={
  tick(p=1){if(!ac)return;const t=ac.currentTime;click(t,.28);clank(t,820*p,.05,.1)},
  whoosh(d=.8){if(!ac)return;const t=ac.currentTime;noise(t,d,.4,'lowpass',140,1100,2.5,d*.5);noise(t,d,.12,'bandpass',500,1800,5,d*.5);for(let i=0;i<4;i++)click(t+d*i/5,.12)},
  thud(){if(!ac)return;const t=ac.currentTime;osc('sine',115,42,t,.35,.9);noise(t,.22,.5,'lowpass',900,140);noise(t,.05,.2,'bandpass',1800,1200,1.5,.002)},
  impact(){if(!ac)return;const t=ac.currentTime;
    osc('sine',95,28,t,1,1);noise(t,.6,.6,'lowpass',3000,90);
    noise(t,.07,.4,'highpass',4500,2500,.8,.002);noise(t,.1,.35,'bandpass',1200,700,1.5,.003);
    clank(t,210,.38,1.5)},
  drop(){if(!ac)return;const t=ac.currentTime;
    noise(t,.85,.5,'lowpass',1600,60,1,.15);osc('sine',85,30,t,.85,.7);
    osc('sine',120,40,t+.62,.4,.6);noise(t+.62,.25,.4,'lowpass',1200,100);clank(t+.62,150,.2,.8)},
  ding(){if(!ac)return;const t=ac.currentTime;noise(t,.04,.35,'highpass',4000,3000,.8,.002);clank(t,520,.3,1.2)},
  riser(d=2){if(!ac)return;const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(38,t);o.frequency.exponentialRampToValueAtTime(115,t+d);
    f.type='lowpass';f.frequency.setValueAtTime(160,t);f.frequency.exponentialRampToValueAtTime(900,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+d*.95);g.gain.linearRampToValueAtTime(0,t+d+.05);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1);
    noise(t,d,.3,'lowpass',150,2600,1.5,d*.9)},
  roll(d=2){if(!ac)return;let t=ac.currentTime,gap=.16,end=t+d,v=.12,n=0;
    while(t<end){click(t,v);if(n++%5===0)clank(t,700+n*20,.04,.12);t+=gap;gap=Math.max(.04,gap*.93);v=Math.min(.4,v*1.04)}},
  pop(){if(!ac)return;const t=ac.currentTime;clank(t,1500+Math.random()*900,.1,.25);noise(t,.05,.15,'highpass',5000,3000,1,.002)},
  fanfare(){if(!ac)return;const t=ac.currentTime;osc('sine',80,26,t,1.6,.9);noise(t,.9,.5,'lowpass',2200,70);noise(t,.06,.35,'highpass',4000,2500,.8,.002);clank(t,150,.28,2.4)}
};
function setMuted(m){muted=m;if(master)master.gain.value=m?0:.85;toast(m?'Som desligado':'Som ligado')}
Object.assign(S,{
  grind(d=1){if(!ac)return;const t=ac.currentTime;noise(t,d,.45,'lowpass',160,420,3,d*.4);osc('sine',62,40,t,d,.3);for(let i=0;i<Math.floor(d*6);i++)click(t+i*d/(d*6),.08)},
  slam(){if(!ac)return;const t=ac.currentTime;osc('sine',72,20,t,1.8,1);osc('triangle',50,25,t,1.2,.7);noise(t,1.3,.85,'lowpass',2600,50);noise(t,.08,.6,'highpass',4000,2500,.8,.002);clank(t,110,.5,2.6);clank(t,165,.3,2.2);for(let i=0;i<8;i++)noise(t+.15+i*.09,.12,.2,'lowpass',1400,200)},
  crack(){if(!ac)return;const t=ac.currentTime;[0,.09,.2,.34].forEach(d=>{noise(t+d,.22,.45,'bandpass',2600,1100,2,.002);click(t+d,.3)});osc('sine',70,45,t,.5,.4)},
  slash(){if(!ac)return;const t=ac.currentTime;noise(t,.32,.5,'highpass',1800,9000,.9,.12);clank(t+.14,1100,.2,.7);noise(t+.14,.05,.4,'highpass',5000,3000,1,.002)}
});
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1400)}

/* ---------- fundo: brasas + confete ---------- */
const bg=$('#bg'),fx=$('#fx'),bctx=bg.getContext('2d'),fctx=fx.getContext('2d');
bg.width=fx.width=W;bg.height=fx.height=H;
const embers=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:(.6+Math.random()*2.4)*U,v:(.3+Math.random()*1.1)*U,dx:(Math.random()-.5)*.5,a:.2+Math.random()*.6,p:Math.random()*6}));
let confetti=[],heat=0;
function burst(x,y,n,dirx){
  const cols=['#e11d2e','#ffffff','#f4c542','#ff5a1f','#c9d0d8'];
  for(let i=0;i<n;i++)confetti.push({x,y,vx:(dirx*(6+Math.random()*16)+(Math.random()-.5)*8)*U,vy:-(10+Math.random()*24)*U,w:(8+Math.random()*10)*U,h:(5+Math.random()*7)*U,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[rnd(cols.length)],t:Math.random()*6});
}
function loop(){
  bctx.clearRect(0,0,W,H);bctx.globalCompositeOperation='lighter';
  for(const e of embers){e.y-=e.v*(1+heat*2.5);e.x+=e.dx+Math.sin(e.y/60+e.p)*.3;if(e.y<-10){e.y=H+10;e.x=Math.random()*W}
    bctx.fillStyle=`rgba(255,${90+heat*80|0},31,${e.a})`;bctx.beginPath();bctx.arc(e.x,e.y,e.r,0,7);bctx.fill()}
  fctx.clearRect(0,0,W,H);
  for(const c of confetti){c.vy+=.55*U;c.vx*=.992;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.t+=.15;
    fctx.save();fctx.translate(c.x,c.y);fctx.rotate(c.r);fctx.scale(1,Math.cos(c.t));fctx.fillStyle=c.c;fctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);fctx.restore()}
  confetti=confetti.filter(c=>c.y<H+60);
  requestAnimationFrame(loop);
}

/* ---------- layout dos cartões ---------- */
const CAPS={1:[1100,500],2:[620,420],3:[540,420],4:[430,400],5:[340,360],10:[340,250]};
function layout(k){
  const ax=140*U,aw=W-280*U,ay=340*U,ah=H-ay-110*U,gap=28*U;
  const cols=k<=5?k:5,rows=Math.ceil(k/cols),cap=CAPS[k]||[340,300];
  const w=Math.min(cap[0]*U,(aw-gap*(cols-1))/cols),h=Math.min(cap[1]*U,(ah-gap*(rows-1))/rows);
  const totH=rows*h+gap*(rows-1),y0=ay+(ah-totH)/2,out=[];
  for(let i=0;i<k;i++){
    const r=Math.floor(i/cols),inRow=Math.min(cols,k-r*cols),totW=inRow*w+gap*(inRow-1);
    out.push({x:ax+(aw-totW)/2+(i%cols)*(w+gap),y:y0+r*(h+gap),w,h});
  }
  return out;
}
function lines(t,th=12){
  if(t.length<=th||!t.includes(' '))return t;
  const ws=t.split(' ');let best=null,bd=1e9;
  for(let i=1;i<ws.length;i++){const a=ws.slice(0,i).join(' '),b=ws.slice(i).join(' '),d=Math.abs(a.length-b.length);if(d<bd){bd=d;best=a+'\n'+b}}
  return best;
}
function fit(c,r){
  const nm=c.querySelector('.nm'),t=c.dataset.name;
  if(!t){nm.style.fontSize=Math.min(r.h*.5,r.w*.4)+'px';return}
  const mini=c.classList.contains('mini'),txt=lines(t,mini?8:12),ls=txt.split('\n'),mx=Math.max(...ls.map(s=>s.length)),n=ls.length;
  nm.textContent=txt;
  c.fs=Math.min(r.h*(mini?(n>1?.36:.5):(n>1?.3:.38)),(r.w-(mini?8:44)*U)/(.52*Math.max(mx,mini?3:5)));
  nm.style.fontSize=c.fs+'px';
}
function unify(list){
  const f=list.filter(c=>c.fs);if(!f.length)return;
  const m=Math.min(...f.map(c=>c.fs));f.forEach(c=>c.querySelector('.nm').style.fontSize=m+'px');
}
function place(c,r){
  c.style.left=r.x+'px';c.style.top=r.y+'px';c.style.width=r.w+'px';c.style.height=r.h+'px';
  c.rect=r;fit(c,r);
}

/* ---------- utilidades de cena ---------- */
function setTitle(eb,t){
  const e=$('#eyebrow'),h=$('#title');[e,h].forEach(x=>x.classList.remove('swap'));void h.offsetWidth;
  e.textContent=eb;h.textContent=t;[e,h].forEach(x=>x.classList.add('swap'));
}
function flash(a=.7,d=700){$('#flash').animate([{opacity:a},{opacity:0}],{duration:d,easing:'ease-out'})}
function ring(c,col){
  const r=c.rect,cx=r.x+r.w/2,cy=r.y+r.h/2,e=document.createElement('div');e.className='ring';if(col)e.style.borderColor=col;
  e.style.cssText+=`left:${cx-100}px;top:${cy-100}px;width:200px;height:200px`;$('#stage').appendChild(e);
  e.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(14)',opacity:0}],{duration:1400,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>e.remove();
}
let keyResolve=null,auto=false;
function waitKey(msg){
  const h=$('#hint');h.textContent=msg||'Espaço para continuar';h.classList.add('on');
  return new Promise(res=>{
    const done=()=>{keyResolve=null;h.classList.remove('on');clearTimeout(tm);res()};
    keyResolve=done;const tm=auto?setTimeout(done,3000):0;
  });
}

/* ---------- o sorteio ---------- */
let all=[],cards=[],alive=[],chain=[],prize='';

async function intro(){
  $('#splashPrize').textContent=prize||'';
  const sp=$('#splash');sp.classList.remove('off','in');void sp.offsetWidth;sp.classList.add('in');
  S.whoosh(1.1);setTimeout(()=>{S.impact();flash(.5)},700);
  await sleep(1500);await waitKey('Espaço para começar');
  sp.classList.add('off');S.whoosh(.7);await sleep(500);
}

function poolLayout(n){
  const ax=60*U,aw=W-120*U,ay=250*U,ah=H-ay-80*U,gap=6*U;
  const cols=Math.max(1,Math.ceil(Math.sqrt(n*aw/ah))),rows=Math.ceil(n/cols);
  const w=Math.min(300*U,(aw-gap*(cols-1))/cols),h=Math.min(110*U,(ah-gap*(rows-1))/rows);
  const totW=cols*w+gap*(cols-1),totH=rows*h+gap*(rows-1),x0=ax+(aw-totW)/2,y0=ay+(ah-totH)/2;
  return Array.from({length:n},(_,i)=>({x:x0+(i%cols)*(w+gap),y:y0+Math.floor(i/cols)*(h+gap),w,h}));
}

/* mais de 10 nomes: todos na tela, molduras pulando até travar nos sorteados */
async function drawPool(){
  const n=all.length,start=chain[0],host=$('#cards');host.innerHTML='';cards=[];
  setTitle('Fase 1',n+' participantes');
  const pr=poolLayout(n);
  all.forEach((nm,i)=>{
    const c=document.createElement('div');c.className='card mini poolin';c.style.setProperty('--i',i);
    c.innerHTML='<div class="num"></div><div class="nm"></div>';c.dataset.name=nm;host.appendChild(c);place(c,pr[i]);cards.push(c);
  });
  S.whoosh(1.3);
  await sleep(Math.min(1500,n*4)+900);
  cards.forEach(c=>c.classList.remove('poolin'));
  setTitle('Fase 1','Sorteando '+start);
  await sleep(700);

  const picks=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,start);
  const T=38,lockFrom=T-start,locked=new Set();let framed=[];
  for(let s=0;s<T;s++){
    framed.forEach(i=>cards[i].classList.remove('frame'));framed=[];
    if(s>=lockFrom){const i=picks[s-lockFrom];locked.add(i);cards[i].classList.add('locked');S.thud();S.ding()}
    const free=start-locked.size,set=new Set();
    while(set.size<free){const i=rnd(n);if(!locked.has(i))set.add(i)}
    framed=[...set];framed.forEach(i=>cards[i].classList.add('frame'));
    S.tick(1+s/T*.5);
    await sleep(55+330*Math.pow(s/(T-1),2.2));
  }
  S.impact();flash(.5,500);shake(10);
  await sleep(1100);

  const sel=picks.map(i=>cards[i]),out=cards.filter(c=>!locked.has(cards.indexOf(c)));
  S.grind(.9);
  out.forEach(c=>{c.style.transition='opacity .6s,transform .6s';c.style.opacity=0;c.style.transform='scale(.4)'});
  const ranks=shuffle(Array.from({length:start},(_,i)=>i)),rects=layout(start);
  await sleep(500);
  S.whoosh(.9);
  sel.forEach((c,k)=>{
    c.classList.remove('mini','locked','frame');c.rank=ranks[k];c.person=picks[k];
    c.querySelector('.num').textContent=String(k+1).padStart(2,'0');place(c,rects[k]);
  });
  await sleep(700);out.forEach(c=>c.remove());
  cards=sel;alive=sel.slice();unify(alive);
  setTitle('Fase 1',start+' classificados');S.impact();flash(.35);
  await sleep(1000);
}

async function draw(){
  if(all.length>chain[0])return drawPool();
  const n=all.length,start=chain[0];
  setTitle('Fase 1','Sorteando '+start+' participantes');
  const picks=shuffle(all.map((_,i)=>i)).slice(0,start);
  const ranks=shuffle(Array.from({length:start},(_,i)=>i));
  const rects=layout(start),host=$('#cards');host.innerHTML='';cards=[];
  for(let i=0;i<start;i++){
    const c=document.createElement('div');c.className='card empty';
    c.innerHTML='<div class="num">'+String(i+1).padStart(2,'0')+'</div><div class="nm"></div>';
    c.rank=ranks[i];c.person=picks[i];host.appendChild(c);place(c,rects[i]);cards.push(c);
  }
  S.whoosh(.8);await sleep(900);
  for(let i=0;i<start;i++){
    const c=cards[i];
    c.dataset.name=all[c.person];c.classList.remove('empty');fit(c,c.rect);c.classList.add('in');
    S.impact();
    host.animate([{transform:'translate(0,0)'},{transform:'translate(-7px,5px)'},{transform:'translate(6px,-4px)'},{transform:'translate(0,0)'}],{duration:260});
    await sleep(520);
  }
  alive=cards.slice();unify(alive);
  setTitle('Fase 1',start+' classificados');S.impact();flash(.35);
  await sleep(600);
}

async function sweep(list,loser,steps,d0,d1){
  const L=list.length,li=list.indexOf(loser);let prev=null;
  for(let s=0;s<steps;s++){
    const c=list[((li-(steps-1-s))%L+L)%L];
    if(prev)prev.classList.remove('spot');c.classList.add('spot');prev=c;
    S.tick(.9+s/steps*.5);await sleep(d0+(d1-d0)*Math.pow(s/(steps-1),2));
  }
}
function sweepMs(steps,d0,d1){let t=0;for(let s=0;s<steps;s++)t+=d0+(d1-d0)*Math.pow(s/(steps-1),2);return t}

function shake(mag=14,dur=520){stage.animate([{translate:'0 0'},{translate:`${-mag}px ${mag*.6}px`},{translate:`${mag*.8}px ${-mag*.5}px`},{translate:`${-mag*.5}px ${mag*.3}px`},{translate:'0 0'}],{duration:dur,easing:'ease-out'})}
function debris(x,y,n,spread=14){
  const cols=['#8b9099','#5d646d','#c9ced6','#3a414a'];
  for(let i=0;i<n;i++)confetti.push({x:x+(Math.random()-.5)*60*U,y,vx:(Math.random()-.5)*spread*U,vy:-(4+Math.random()*14)*U,w:(6+Math.random()*16)*U,h:(5+Math.random()*12)*U,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[rnd(cols.length)],t:0});
}
const cx=c=>c.rect.x+c.rect.w/2, cy=c=>c.rect.y+c.rect.h/2;

/* --- rodada 1: prensa de ferro --- */
async function press(c){
  c.classList.remove('spot');const r=c.rect,b=document.createElement('div');b.className='press';
  b.style.cssText=`left:${r.x-14}px;width:${r.w+28}px;height:${r.h+24}px;top:${-r.h-60}px`;$('#stage').appendChild(b);
  S.whoosh(.35);
  await b.animate([{top:-r.h-60+'px'},{top:(r.y-12)+'px'}],{duration:340,easing:'cubic-bezier(.6,0,1,.6)',fill:'forwards'}).finished;
  c.style.visibility='hidden';S.impact();shake(12);flash(.25,250);debris(cx(c),r.y+r.h,28);
  await sleep(520);S.grind(.7);
  await b.animate([{top:(r.y-12)+'px'},{top:-r.h-60+'px'}],{duration:700,easing:'ease-in-out',fill:'forwards'}).finished;b.remove();
}

/* --- rodada 2: rachadura e estilhaços de pedra --- */
const PIECES=['0 0,42% 0,34% 38%,0 30%','42% 0,100% 0,100% 34%,62% 42%,34% 38%','0 30%,34% 38%,48% 72%,22% 100%,0 100%','34% 38%,62% 42%,70% 80%,48% 72%','62% 42%,100% 34%,100% 78%,70% 80%','48% 72%,70% 80%,100% 78%,100% 100%,22% 100%'];
function cloneCard(c,clip){const n=c.cloneNode(true);n.classList.remove('in','spot');n.style.transition='none';n.style.zIndex=11;n.style.clipPath=`polygon(${clip})`;$('#cards').appendChild(n);return n}
async function shatter(c){
  c.classList.remove('spot');
  const cr=document.createElement('div');cr.className='crack';
  cr.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path pathLength="1" d="M50 0 L46 22 L56 40 L44 58 L52 78 L48 100"/><path pathLength="1" d="M46 22 L24 30 L10 52"/><path pathLength="1" d="M56 40 L78 46 L96 38"/><path pathLength="1" d="M44 58 L26 74 L12 96"/></svg>';
  c.appendChild(cr);S.crack();shake(5,400);
  cr.querySelectorAll('path').forEach((p,i)=>p.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:420,delay:i*90,fill:'forwards'}));
  await sleep(850);
  const ps=PIECES.map(p=>cloneCard(c,p));c.style.visibility='hidden';
  S.impact();flash(.3,300);shake(10);debris(cx(c),cy(c),34,20);
  await Promise.all(ps.map(n=>{const dx=(Math.random()-.5)*340*U,dy=(520+Math.random()*320)*U,rot=(Math.random()-.5)*80;
    return n.animate([{transform:'none',opacity:1},{transform:`translate(${dx*.35}px,${-50*U}px) rotate(${rot*.4}deg)`,opacity:1,offset:.25},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],{duration:900+Math.random()*400,easing:'ease-in'}).finished}));
  ps.forEach(n=>n.remove());
}

/* --- rodada 3: lâmina --- */
async function slash(c){
  c.classList.remove('spot');const r=c.rect,bl=document.createElement('div');bl.className='blade';
  const len=Math.hypot(r.w,r.h)*1.5,ang=-Math.atan2(r.h,r.w)*180/Math.PI;
  bl.style.cssText=`left:${cx(c)-len/2}px;top:${cy(c)-4}px;width:${len}px;height:8px;transform:rotate(${ang}deg)`;
  $('#stage').appendChild(bl);S.slash();
  await bl.animate([{clipPath:'inset(0 100% 0 0)',opacity:1},{clipPath:'inset(0 0 0 0)',opacity:1,offset:.4},{clipPath:'inset(0 0 0 0)',opacity:0}],{duration:460,fill:'forwards'}).finished;bl.remove();
  const A=cloneCard(c,'0 0,100% 0,0 100%'),B=cloneCard(c,'100% 0,100% 100%,0 100%');c.style.visibility='hidden';
  flash(.6,350);shake(8,400);debris(cx(c),cy(c),16,12);S.impact();
  const go=(n,s)=>n.animate([{transform:'none',opacity:1},{transform:`translate(${s*70}px,${s*-30}px) rotate(${s*-9}deg)`,opacity:1,offset:.22},{transform:`translate(${s*230}px,${760*U}px) rotate(${s*-32}deg)`,opacity:0}],{duration:1050,easing:'ease-in'}).finished;
  await Promise.all([go(A,-1),go(B,1)]);A.remove();B.remove();
}

async function handKill(loser){
  const other=alive.find(x=>x!==loser);
  setTitle('A decisão','Só um fica');
  const wd=Math.min(loser.rect.w*1.7,1300*U),ht=wd*1376/768,tipK=.872,hx=.54;
  const arm=document.createElement('div');arm.className='arm';arm.innerHTML='<img src="'+ARM_IMG+'" alt="">';
  arm.style.cssText=`width:${wd}px;height:${ht}px;left:${W/2-wd*hx}px;top:${-ht-60}px`;$('#stage').appendChild(arm);
  const left=c=>cx(c)-wd*hx+'px',hover=395*U-ht*tipK+'px';
  await sleep(300);S.grind(1.4);
  arm.style.transition='top 1.4s cubic-bezier(.2,.7,.2,1)';arm.style.top=hover;await sleep(1500);shake(10,500);S.thud();
  arm.style.transition='left .75s cubic-bezier(.6,0,.3,1)';
  const seq=[other,loser,other,loser],gaps=[900,900,1100,1500];
  for(let i=0;i<seq.length;i++){
    alive.forEach(x=>x.classList.remove('spot'));seq[i].classList.add('spot');
    arm.style.left=left(seq[i]);S.grind(.7);S.tick(.8);await sleep(gaps[i]);
  }
  S.riser(1.7);S.roll(1.7);
  arm.animate([{translate:'0 0'},{translate:'4px -3px'},{translate:'-4px 3px'},{translate:'0 0'}],{duration:90,iterations:18});
  await sleep(1800);
  arm.style.transition='top .26s cubic-bezier(.7,0,1,.4)';
  arm.style.top=loser.rect.y+loser.rect.h*.92-ht*tipK+'px';await sleep(255);
  loser.classList.remove('spot');loser.style.transformOrigin='50% 100%';loser.style.transform='scale(1.05,.07)';
  S.slam();shake(28,900);flash(.9,600);debris(cx(loser),cy(loser)+loser.rect.h*.3,70,30);ring(loser,'#c9ced6');
  await sleep(900);
  S.grind(1.2);arm.style.transition='top 1.4s ease-in-out';arm.style.top=-ht-60+'px';
  loser.style.transition='opacity .8s';loser.style.opacity=0;
  await sleep(1500);arm.remove();loser.style.visibility='hidden';
}

async function eliminateTo(k,idx){
  const label=k===1?'A grande final':k+' classificados';
  setTitle('Rodada '+idx,k===1?'Quem leva?':k+' seguem');
  S.whoosh(.8);await sleep(900);
  const losers=shuffle(alive.filter(c=>c.rank>=k));
  for(const c of losers){
    if(alive.length===2)await handKill(c);
    else{
      const tense=alive.length<=3,steps=tense?16:11+rnd(4),d0=tense?85:65,d1=tense?420:230;
      if(tense)S.riser(sweepMs(steps,d0,d1)/1000+.3);
      await sweep(alive,c,steps,d0,d1);
      await sleep(tense?500:260);
      await(k===1?slash:k===3?shatter:press)(c);
    }
    alive=alive.filter(x=>x!==c);
    if(k===1&&alive.length>1){const rr=layout(alive.length);S.whoosh(.7);alive.forEach((x,i)=>place(x,rr[i]));unify(alive);await sleep(1000)}
  }
  await sleep(300);
  if(k>1){
    const rects=layout(k);S.whoosh(.9);alive.forEach((c,i)=>place(c,rects[i]));unify(alive);
    await sleep(1000);setTitle('Rodada '+idx,label);S.impact();flash(.3);await sleep(500);
  }
}

async function crown(){
  const w=alive[0];
  heat=.6;S.grind(2.2);
  setTitle('E o vencedor é…','');await sleep(2400);
  w.classList.add('win');w.insertAdjacentHTML('afterbegin','<div class="tag">VENCEDOR</div>');
  place(w,layout(1)[0]);
  flash(1,1400);S.fanfare();heat=1;$('#beams').classList.add('on');
  setTitle('Parabéns!',prize?prize:'Vencedor');
  setTimeout(()=>ring(w),150);setTimeout(()=>ring(w,'#e11d2e'),450);setTimeout(()=>ring(w),800);
  for(let i=0;i<7;i++){
    setTimeout(()=>{burst(0,H*.85,70,1);burst(W,H*.85,70,-1)},i*650);
  }
  await sleep(4800);
  for(let i=0;i<4;i++)setTimeout(()=>{burst(W*.25,H*.2,50,0);burst(W*.75,H*.2,50,0)},i*900);
  const h=$('#hint');h.textContent='R ou Esc para voltar à configuração';h.classList.add('on');
}

async function run(){
  const ac2=new AbortController();
  prize=$('#prize').value.trim();
  $('#cards').innerHTML='';$('#beams').classList.remove('on');$('#title').textContent='';$('#eyebrow').textContent='';
  const n=all.length,start=Math.min(10,n);
  chain=[start,...[5,3,1].filter(x=>x<start)];
  await intro();await draw();
  for(let i=1;i<chain.length;i++){
    await waitKey(i===1?'Espaço para eliminar':'Espaço para próxima rodada');
    await eliminateTo(chain[i],i);
  }
  await crown();
}

  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}

addEventListener('keydown',e=>{
  if(!stage.hidden){
    if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowRight'){e.preventDefault();keyResolve&&keyResolve()}
    else if(e.key==='m'||e.key==='M')setMuted(!muted);
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
    else if(e.key==='r'||e.key==='R'){location.reload()}
    else if(e.key==='Escape'){location.reload()}
  }
});
addEventListener('click',e=>{if(!stage.hidden&&keyResolve)keyResolve()});
let mt;addEventListener('mousemove',()=>{if(stage.hidden)return;document.body.classList.remove('idle');clearTimeout(mt);mt=setTimeout(()=>document.body.classList.add('idle'),2500)});
</script>
</body>
</html>
