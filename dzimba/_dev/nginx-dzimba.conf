# Academia D'Zimba: site estático na VPS antiga (89.117.79.163)
#   https://dzimba.89-117-79-163.sslip.io/  (provisório até ter domínio próprio)
server {
    listen 80;
    listen [::]:80;
    server_name dzimba.89-117-79-163.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/dzimba; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dzimba.89-117-79-163.sslip.io;
    ssl_certificate /etc/letsencrypt/live/dzimba.89-117-79-163.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dzimba.89-117-79-163.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dzimba;
    index index.html;
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }  # HTML sempre confere a versão nova
    # API do curso de corrida (pm2 "dzimba-corrida", código em /opt/dzimba-corrida). ^~ para o regex de cache não pegar
    location ^~ /corrida/api/ {
        proxy_pass http://127.0.0.1:8404/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 1m;
    }
    location ~* \.(css|js|jpg|jpeg|png|svg|webp|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
}
