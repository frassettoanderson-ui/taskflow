<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>OX Controle</title>
<style>
  :root{
    --bg:#0b0b0c; --painel:#151517; --painel2:#1d1d20; --linha:#2a2a2e;
    --texto:#f2f2f2; --suave:#9a9aa1; --ox:#e1251b; --ox-esc:#a8150d; --ok:#3fb950; --aviso:#d29922;
    --r1:5px; --r2:7px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--texto);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding:16px 16px 40px;max-width:1100px;margin:0 auto}
  header{text-align:center;padding:8px 0 18px}
  header .marca{font-size:30px;font-weight:800;letter-spacing:.06em}
  header .marca b{color:var(--ox)}
  header .sub{color:var(--suave);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  .trava{display:none;background:var(--ox-esc);border:1px solid var(--ox);border-radius:var(--r2);padding:14px;text-align:center;font-weight:600;margin-bottom:16px}
  .trava.on{display:block}
  .trava small{display:block;font-weight:400;opacity:.85;margin-top:2px}
  section{background:var(--painel);border:1px solid var(--linha);border-radius:var(--r2);padding:16px;margin-bottom:16px}
  section h2{text-align:center;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);font-weight:700}
  .estado{text-align:center;font-size:12px;color:var(--suave);margin:4px 0 14px;min-height:16px}
  .estado.erro{color:var(--ox)}
  .grade{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .grade.grande{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .grade.luz{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  button{font:inherit;color:inherit;border:1px solid var(--linha);background:var(--painel2);border-radius:var(--r1);padding:16px 10px;min-height:58px;text-align:center;cursor:pointer;transition:transform .08s,border-color .15s,background .15s;touch-action:manipulation}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.35;cursor:not-allowed;transform:none}
  button.atual{border-color:var(--ox);background:#2a1312;box-shadow:inset 0 0 0 1px var(--ox)}
  .grande button{min-height:84px;font-size:18px;font-weight:700;letter-spacing:.02em}
  .luz button{min-height:76px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .luz button .tecla{font-size:12px;opacity:.75;font-weight:700}
  .luz button .nome{font-size:13px;font-weight:600;word-break:break-word}
  .luz button.atual{outline:3px solid #fff;outline-offset:-3px}
  .barra{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .barra button{min-height:44px;padding:8px 18px}
  .barra .pag{min-width:110px;text-align:center;font-weight:700}
  button.blackout.on{background:var(--ox);border-color:var(--ox);color:#fff}
  .vazio{text-align:center;color:var(--suave);padding:14px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(120%);background:#26262a;border:1px solid var(--linha);border-radius:var(--r2);padding:12px 18px;max-width:calc(100% - 32px);text-align:center;transition:transform .25s;z-index:5}
  .toast.on{transform:translateX(-50%) translateY(0)}
  .toast.erro{border-color:var(--ox)}
  #pin{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
  #pin.on{display:flex}
  #pin form{background:var(--painel);border:1px solid var(--linha);border-radius:var(--r2);padding:28px 22px;width:100%;max-width:340px;text-align:center}
  #pin h3{font-size:20px;margin-bottom:6px}
  #pin p{color:var(--suave);font-size:13px;margin-bottom:16px}
  #pin input{width:100%;font:inherit;font-size:26px;letter-spacing:.4em;text-align:center;padding:12px;background:var(--bg);border:1px solid var(--linha);border-radius:var(--r1);color:var(--texto);margin-bottom:12px}
  #pin button{width:100%;background:var(--ox);border-color:var(--ox);font-weight:700}
  @media (max-width:520px){
    .grade{grid-template-columns:repeat(2,1fr)}
    .grade.luz{grid-template-columns:repeat(3,1fr)}
    .grade.grande{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="marca"><b>OX</b> CONTROLE</div>
  <div class="sub">Telão &middot; Luz &middot; Ambiente</div>
</header>

<div class="trava" id="trava">Evento das 21h em andamento<small id="travaTxt"></small></div>

<section>
  <h2>Momentos</h2>
  <div class="estado"></div>
  <div class="grade grande" id="momentos"></div>
</section>

<section>
  <h2>Telão</h2>
  <div class="estado" id="obsEstado"></div>
  <div class="grade" id="obsCenas"></div>
</section>

<section>
  <h2>Luz do palco</h2>
  <div class="estado" id="luzEstado"></div>
  <div class="barra">
    <button id="pagMenos" aria-label="Página anterior">&lsaquo;</button>
    <div class="pag" id="pagNome">Página 1</div>
    <button id="pagMais" aria-label="Próxima página">&rsaquo;</button>
    <button class="blackout" id="blackout">Blackout</button>
  </div>
  <div class="grade luz" id="luzCenas"></div>
</section>

<section>
  <h2>Luz ambiente</h2>
  <div class="estado" id="ambEstado"></div>
  <div class="grade" id="ambCenas"></div>
</section>

<div class="toast" id="toast"></div>

<div id="pin">
  <form id="pinForm">
    <h3>OX Controle</h3>
    <p>Digite o PIN do painel</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <button type="submit">Entrar</button>
  </form>
</div>

<script>
const TECLAS = ["A","S","D","F","G","H","J","K","L","Z","X","C","V","B","N","M"];
let pagina = 0, ultimo = null, ocupado = false;
const $ = id => document.getElementById(id);

function lerPin(){ try { return localStorage.getItem("oxpin") || ""; } catch(e){ return ""; } }
function salvarPin(v){ try { localStorage.setItem("oxpin", v); } catch(e){} }

async function api(caminho, corpo){
  const op = { headers: { "X-Pin": lerPin() } };
  if (corpo !== undefined){ op.method = "POST"; op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(corpo); }
  const r = await fetch(caminho, op);
  if (r.status === 401){ $("pin").classList.add("on"); throw new Error("PIN inválido"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.erro || ("Erro " + r.status));
  return j;
}

let toastT;
function aviso(txt, erro){
  const t = $("toast"); t.textContent = txt; t.className = "toast on" + (erro ? " erro" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast", erro ? 5000 : 1800);
}

async function comando(caminho, corpo, rotulo){
  if (ocupado) return;
  ocupado = true;
  try { await api(caminho, corpo); aviso(rotulo); }
  catch(e){ aviso(e.message, true); }
  finally { ocupado = false; atualizar(); }
}

function botao(txt, ao, extra){
  const b = document.createElement("button");
  b.textContent = txt; b.onclick = ao;
  if (extra) extra(b);
  return b;
}

function corTexto(c){ return (0.299*c.r + 0.587*c.g + 0.114*c.b) > 186 ? "#000" : "#fff"; }

function render(s){
  const trav = s.evento.travado;
  $("trava").classList.toggle("on", trav);
  $("travaTxt").textContent = "Comandos liberados de novo após " + s.evento.fim;

  const mom = $("momentos"); mom.replaceChildren();
  if (!s.momentos.length) mom.innerHTML = '<div class="vazio">Nenhum momento configurado</div>';
  s.momentos.forEach(m => mom.append(botao(m.nome, () => comando("/api/momento", {id: m.id}, m.nome), b => b.disabled = trav)));

  const oe = $("obsEstado"), oc = $("obsCenas"); oc.replaceChildren();
  if (s.obs.ok){
    oe.textContent = "No ar: " + s.obs.atual; oe.className = "estado";
    s.obs.cenas.forEach(n => oc.append(botao(n, () => comando("/api/obs/cena", {nome: n}, "Telão: " + n),
      b => { b.disabled = trav; if (n === s.obs.atual) b.classList.add("atual"); })));
  } else { oe.textContent = s.obs.erro; oe.className = "estado erro"; }

  const le = $("luzEstado"), lc = $("luzCenas"); lc.replaceChildren();
  $("pagNome").textContent = "Página " + (pagina + 1);
  if (s.luz.ok){
    le.textContent = s.luz.blackout ? "Blackout ligado" : "Conectado ao Lumikit"; le.className = "estado";
    $("blackout").classList.toggle("on", s.luz.blackout);
    $("blackout").textContent = s.luz.blackout ? "Desligar blackout" : "Blackout";
    $("blackout").disabled = trav;
    if (!s.luz.cenas.length) lc.innerHTML = '<div class="vazio">Página sem cenas</div>';
    s.luz.cenas.forEach((c, i) => {
      if (!c.nome && !c.cor) return;
      lc.append(botao("", () => comando("/api/luz/cena", {pagina, cena: i}, "Luz: " + (c.nome || TECLAS[i])), b => {
        b.innerHTML = '<span class="tecla"></span><span class="nome"></span>';
        b.querySelector(".tecla").textContent = TECLAS[i] || (i + 1);
        b.querySelector(".nome").textContent = c.nome || "Vazia";
        if (c.cor){ b.style.background = `rgb(${c.cor.r},${c.cor.g},${c.cor.b})`; b.style.color = corTexto(c.cor); }
        if (s.luz.ativa.pagina === pagina && s.luz.ativa.cena === i) b.classList.add("atual");
        b.disabled = trav;
      }));
    });
  } else { le.textContent = s.luz.erro; le.className = "estado erro"; }

  const ae = $("ambEstado"), ac = $("ambCenas"); ac.replaceChildren();
  ae.textContent = "Porta " + s.ambiente.porta;
  s.ambiente.cenas.forEach(c => ac.append(botao(c.nome, () => comando("/api/ambiente/cena", {id: c.id}, "Ambiente: " + c.nome), b => b.disabled = trav)));
}

async function atualizar(){
  try { ultimo = await api("/api/status?pagina=" + pagina); render(ultimo); }
  catch(e){ if (e.message !== "PIN inválido") $("obsEstado").textContent = "Sem contato com o agente"; }
}

$("pagMenos").onclick = () => { pagina = pagina <= 0 ? 99 : pagina - 1; atualizar(); };
$("pagMais").onclick  = () => { pagina = pagina >= 99 ? 0 : pagina + 1; atualizar(); };
$("blackout").onclick = () => {
  const ligar = !(ultimo && ultimo.luz.blackout);
  comando("/api/luz/blackout", {ligar}, ligar ? "Blackout ligado" : "Blackout desligado");
};
$("pinForm").onsubmit = e => { e.preventDefault(); salvarPin($("pinInput").value.trim()); $("pin").classList.remove("on"); atualizar(); };

atualizar();
setInterval(() => { if (!ocupado && !document.hidden) atualizar(); }, 3000);
</script>
</body>
</html>
