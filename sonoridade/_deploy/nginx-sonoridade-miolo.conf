# Miolo comum dos sites do Sonoridade (porta 8180 e HTTPS). Vai para /etc/nginx/snippets/.
root /var/www/sonoridade;
index index.html;

access_log /var/log/nginx/sonoridade.access.log;
error_log  /var/log/nginx/sonoridade.error.log;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

location = / { return 302 /app/; }

location / {
    try_files $uri $uri/ =404;
}

# imagens e áudio não mudam de nome: cache longo
location ~* \.(webp|jpg|jpeg|png|svg|woff2|m4a|mp3)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# html, css, js e json sempre revalidados, para não servir versão velha depois do deploy
location ~* \.(html|css|js|json)$ {
    add_header Cache-Control "no-cache";
}

location ~ /\. { deny all; }
