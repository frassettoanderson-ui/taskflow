# Sonoridade — app de estudo (estático), na VPS antiga.
#   http://89.117.79.163:8180/app/                    endereço antigo (sem HTTPS)
#   https://sonoridade.89-117-79-163.sslip.io/app/   com HTTPS: microfone (afinador) e protótipo do VS
# Certificado: certbot certonly --nginx -d sonoridade.89-117-79-163.sslip.io (renova sozinho).
# O miolo de cada site está em /etc/nginx/snippets/sonoridade-miolo.conf (enviado pelo deploy).

server {
    listen 8180;
    listen [::]:8180;
    server_name _;
    include snippets/sonoridade-miolo.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name sonoridade.89-117-79-163.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/sonoridade; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sonoridade.89-117-79-163.sslip.io;
    ssl_certificate /etc/letsencrypt/live/sonoridade.89-117-79-163.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonoridade.89-117-79-163.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/sonoridade-miolo.conf;
}
