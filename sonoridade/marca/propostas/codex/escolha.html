<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonoridade — escolha da logo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#0d0d0c; color:#f1ede4; font-family:'Archivo',system-ui,sans-serif; padding:24px 16px 48px; }
  h1 { text-align:center; font-stretch:75%; font-weight:800; font-size:30px; margin:0 0 4px; }
  .sub { text-align:center; color:#99948a; margin:0 0 24px; }
  .grade { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  figure { margin:0; background:#171715; border:1px solid #2e2e2a; border-radius:7px; overflow:hidden; text-align:center; }
  figure img { width:100%; display:block; }
  figcaption { padding:10px 12px 14px; }
  figcaption b { display:block; font-stretch:80%; font-size:20px; }
  figcaption span { color:#99948a; font-size:14px; }
  .fraca { opacity:.55; }
</style>
</head>
<body>
<h1>Escolha da logo</h1>
<p class="sub">10 opções geradas no Codex. Diga o número (ou dois para misturar).</p>
<div class="grade">
  <figure><img src="lote1/01.png" alt=""><figcaption><b>1 · S de cordas</b><span>Três cordas formando o S. Forte como ícone.</span></figcaption></figure>
  <figure><img src="lote1/02.png" alt=""><figcaption><b>2 · S na boca do violão</b><span>O círculo cortado pelo S. Simples e marcante.</span></figcaption></figure>
  <figure><img src="lote1/03.png" alt=""><figcaption><b>3 · Cabeça do violão</b><span>Tarraxas como pontos. Óbvio de cara que é instrumento.</span></figcaption></figure>
  <figure><img src="lote1/04.png" alt=""><figcaption><b>4 · Palheta com S</b><span>Palheta com o S vazado.</span></figcaption></figure>
  <figure class="fraca"><img src="lote1/05.png" alt=""><figcaption><b>5 · Só o nome</b><span>Ficou sem personalidade.</span></figcaption></figure>
  <figure><img src="lote2/06.png" alt=""><figcaption><b>6 · O com corda vibrando</b><span>A boca do violão e uma corda em onda.</span></figcaption></figure>
  <figure><img src="lote2/07.png" alt=""><figcaption><b>7 · Braço em perspectiva</b><span>Trastes vistos de frente, num quadrado.</span></figcaption></figure>
  <figure class="fraca"><img src="lote2/08.png" alt=""><figcaption><b>8 · Selo com S</b><span>Parece cifrão ($). Descartaria.</span></figcaption></figure>
  <figure><img src="lote2/09.png" alt=""><figcaption><b>9 · Palheta com gota</b><span>Palheta com uma onda de som vazada.</span></figcaption></figure>
  <figure><img src="lote2/10.png" alt=""><figcaption><b>10 · Desenho de acorde</b><span>As bolinhas do acorde desenham o S.</span></figcaption></figure>
</div>
</body>
</html>
