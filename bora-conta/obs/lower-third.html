<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bora Contá · Lower third</title>
<link rel="stylesheet" href="base.css">
<style>
  .lt { position: absolute; left: 90px; bottom: 96px; display: flex; align-items: flex-end; }
  .lt__logo { position: relative; width: 132px; height: 132px; flex: none; margin-right: -26px; z-index: 3; opacity: 0; }
  .lt__logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 6px var(--laranja), 0 14px 30px rgba(10, 0, 22, .55); }
  .lt__pilha { position: relative; display: flex; flex-direction: column; align-items: flex-start; padding-bottom: 6px; }
  .lt__tag {
    margin-left: 46px; margin-bottom: -2px; padding: 5px 16px 4px; border-radius: 8px 8px 0 0; background: var(--laranja); color: var(--roxo-3);
    font-weight: 900; font-size: 17px; letter-spacing: .22em; text-transform: uppercase; clip-path: inset(100% 0 0 0);
  }
  .lt__nome {
    position: relative; padding: 4px 44px 6px 54px; border-radius: 0 16px 0 0;
    background: linear-gradient(100deg, var(--roxo-2), var(--roxo) 60%, var(--roxo-3));
    box-shadow: 0 16px 40px rgba(10, 0, 22, .5), inset 0 0 0 1px rgba(226, 208, 245, .12);
    font-family: "Anton"; font-size: 74px; line-height: 1.12; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap;
    clip-path: inset(0 100% 0 0 round 0 16px 0 0);
  }
  .lt__nome::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--laranja); }
  .lt__linha {
    position: relative; margin-left: 26px; padding: 9px 26px 10px 30px; border-radius: 0 0 14px 0; background: var(--rosa);
    display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 25px; white-space: nowrap;
    box-shadow: 0 12px 28px rgba(80, 0, 30, .35); clip-path: inset(0 100% 0 0);
  }
  .lt__linha i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
  .lt__linha .insta { font-weight: 900; }
  .txt { display: inline-block; }
</style>
</head>
<body>
<div class="palco">
  <div class="lt" id="lt">
    <div class="lt__logo" id="logo"><img src="img/logo_bora_conta.webp" alt=""></div>
    <div class="lt__pilha">
      <div class="lt__tag" id="tag"></div>
      <div class="lt__nome" id="nome"><span class="txt" id="nomeTxt"></span></div>
      <div class="lt__linha" id="linha"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="obs.js"></script>
<script>
(async function () {
  const C = window.BORA, Q = OBS.q, $ = (id) => document.getElementById(id);
  // aceita ?id=anderson (do config) ou ?nome=...&linha=...&etiqueta=...&insta=...
  const base = Q.get("nome") ? {} : OBS.escolhe(C.pessoas);
  const p = Object.assign({}, base, ...["nome", "linha", "etiqueta", "insta"].filter((k) => Q.get(k) !== null).map((k) => ({ [k]: Q.get(k) })));
  const tempo = +(Q.get("tempo") ?? C.tempoLowerThird ?? 8);

  $("tag").textContent = p.etiqueta || "";
  if (!p.etiqueta) $("tag").style.display = "none";
  $("nomeTxt").textContent = p.nome || "";
  const partes = [p.linha, p.insta].filter(Boolean);
  $("linha").innerHTML = partes.map((t, i) => `<span class="txt ${i && p.insta ? "insta" : ""}">${t}</span>`).join("<i></i>");
  if (!partes.length) $("linha").style.display = "none";
  await document.fonts.ready;
  // nome curto: a placa roxa acompanha pelo menos a linha rosa de baixo
  if (partes.length) $("nome").style.minWidth = $("linha").offsetWidth + 26 + "px";

  const A = (el, k, o) => el.animate(k, Object.assign({ fill: "both", easing: "cubic-bezier(.16,1,.3,1)" }, o));
  A($("logo"), [{ opacity: 0, transform: "scale(.3) rotate(-20deg)" }, { opacity: 1, transform: "none" }], { duration: 700, easing: "cubic-bezier(.34,1.56,.64,1)" });
  A($("nome"), [{ clipPath: "inset(0 100% 0 0 round 0 16px 0 0)" }, { clipPath: "inset(0 0% 0 0 round 0 16px 0 0)" }], { duration: 800, delay: 180 });
  A($("nomeTxt"), [{ opacity: 0, transform: "translateX(-40px)" }, { opacity: 1, transform: "none" }], { duration: 800, delay: 300 });
  A($("linha"), [{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)" }], { duration: 700, delay: 420 });
  document.querySelectorAll("#linha .txt").forEach((el, i) => A(el, [{ opacity: 0, transform: "translateY(18px)" }, { opacity: 1, transform: "none" }], { duration: 600, delay: 560 + i * 120 }));
  A($("tag"), [{ clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)" }], { duration: 500, delay: 650 });

  if (tempo > 0) {
    await OBS.espera(tempo + 0.8);
    const S = { easing: "cubic-bezier(.7,0,.84,0)" };
    A($("tag"), [{ clipPath: "inset(0% 0 0 0)" }, { clipPath: "inset(100% 0 0 0)" }], { duration: 300, ...S });
    A($("linha"), [{ clipPath: "inset(0 0% 0 0)" }, { clipPath: "inset(0 100% 0 0)" }], { duration: 450, delay: 100, ...S });
    A($("nome"), [{ clipPath: "inset(0 0% 0 0 round 0 16px 0 0)" }, { clipPath: "inset(0 100% 0 0 round 0 16px 0 0)" }], { duration: 550, delay: 200, ...S });
    A($("logo"), [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.3) rotate(20deg)" }], { duration: 450, delay: 420, ...S });
  }
})();
</script>
</body>
</html>
