<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bora Contá · Inscreva-se</title>
<link rel="stylesheet" href="base.css">
<style>
  /* chamada curta, canto inferior direito (não briga com o lower third, que fica à esquerda) */
  .chip { position: absolute; right: 80px; bottom: 80px; height: 112px; display: flex; align-items: center; gap: 22px; padding: 0 24px 0 18px; }
  .chip__fundo {
    position: absolute; inset: 0; border-radius: 999px;
    background: linear-gradient(100deg, var(--roxo-2), var(--roxo) 55%, var(--roxo-3));
    box-shadow: 0 16px 40px rgba(10, 0, 22, .55), inset 0 0 0 1px rgba(226, 208, 245, .14);
    clip-path: inset(0 0 0 100% round 999px);
  }
  .chip__logo { position: relative; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 5px var(--laranja); opacity: 0; flex: none; }
  .chip__logo img { width: 100%; height: 100%; object-fit: cover; }
  .chip__txt { position: relative; display: flex; flex-direction: column; }
  .chip__txt small { font-weight: 700; font-size: 16px; letter-spacing: .22em; text-transform: uppercase; color: var(--laranja); }
  .chip__txt strong { font-family: "Anton"; font-weight: 400; font-size: 46px; line-height: 1.08; text-transform: uppercase; white-space: nowrap; }
  .chip .a { opacity: 0; }
  .chip .botao, .chip .sino { position: relative; }
</style>
</head>
<body>
<div class="palco">
  <div class="chip" id="chip">
    <div class="chip__fundo" id="fundo"></div>
    <div class="chip__logo" id="logo"><img src="img/logo_bora_conta.webp" alt=""></div>
    <div class="chip__txt"><small class="a" id="k">Gostando da conversa?</small><strong class="a">Se inscreve no canal</strong></div>
    <div class="botao a" id="botao"><i class="botao__play"></i><span class="t1">Inscrever-se</span><span class="t2">Inscrito</span></div>
    <div class="sino a" id="sino"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg></div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 10.5-6.6 1.2 3.9 7.3-3 1.6-3.9-7.4L4 20z" fill="#fff" stroke="#160029" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="config.js"></script>
<script src="obs.js"></script>
<script>
(async function () {
  const C = window.BORA, Q = OBS.q, $ = (id) => document.getElementById(id);
  const tempo = +(Q.get("tempo") || C.tempoInscreva || 8);
  const repete = +(Q.get("repete") || 0);
  if (Q.get("texto")) $("k").textContent = Q.get("texto");
  await document.fonts.ready;
  $("botao").style.width = $("botao").offsetWidth + "px";   // trava a largura: o "Inscrito" não faz a faixa pular
  const A = (el, k, o) => el.animate(k, Object.assign({ fill: "both", easing: "cubic-bezier(.16,1,.3,1)" }, o));
  const S = "cubic-bezier(.7,0,.84,0)";

  async function rodada() {
    $("botao").classList.remove("feito"); $("sino").classList.remove("ativo");
    A($("fundo"), [{ clipPath: "inset(0 0 0 100% round 999px)" }, { clipPath: "inset(0 0 0 0% round 999px)" }], { duration: 850 });
    A($("logo"), [{ opacity: 0, transform: "scale(.3) rotate(-20deg)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 380, easing: "cubic-bezier(.34,1.56,.64,1)" });
    document.querySelectorAll(".chip .a").forEach((el, i) => A(el, [{ opacity: 0, transform: "translateY(26px)" }, { opacity: 1, transform: "none" }], { duration: 600, delay: 420 + i * 90 }));
    await OBS.espera(1.6);

    const ch = $("chip").getBoundingClientRect(), bt = $("botao").getBoundingClientRect(), si = $("sino").getBoundingClientRect();
    const px = (r, dx, dy) => `translate(${r.left - ch.left + dx}px, ${r.top - ch.top + dy}px)`;
    await A($("cursor"), [{ opacity: 0, transform: px(bt, bt.width * .3, 170) }, { opacity: 1, transform: px(bt, bt.width * .55, bt.height * .45) }], { duration: 800 }).finished;
    await $("botao").animate([{ transform: "scale(1)" }, { transform: "scale(.9)" }, { transform: "scale(1)" }], { duration: 260 }).finished;
    $("botao").classList.add("feito");
    await OBS.espera(0.35);
    await A($("cursor"), [{ transform: px(bt, bt.width * .55, bt.height * .45) }, { transform: px(si, si.width * .5, si.height * .5) }], { duration: 520 }).finished;
    $("sino").classList.add("ativo");
    $("sino").querySelector("svg").animate([0, 22, -18, 14, -10, 6, 0].map((r) => ({ transform: `rotate(${r}deg)` })), { duration: 900, delay: 120 });
    await OBS.espera(0.5);
    A($("cursor"), [{ opacity: 1, transform: px(si, si.width * .5, si.height * .5) }, { opacity: 0, transform: px(si, si.width + 60, 150) }], { duration: 600 });
    await OBS.espera(Math.max(1, tempo - 3.8));

    [...document.querySelectorAll(".chip .a")].reverse().forEach((el, i) => A(el, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-20px)" }], { duration: 350, delay: i * 40, easing: S }));
    A($("logo"), [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.3) rotate(20deg)" }], { duration: 400, delay: 150, easing: S });
    await A($("fundo"), [{ clipPath: "inset(0 0 0 0 round 999px)" }, { clipPath: "inset(0 100% 0 0 round 999px)" }], { duration: 700, delay: 300, easing: S }).finished;
    if (repete > 0) { await OBS.espera(repete); rodada(); }
  }
  rodada();
})();
</script>
</body>
</html>
