<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Membro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="tela-login">
  <form id="f" class="card-login" style="width:380px">
    <div class="logo-mark" style="align-self:center">a</div>
    <h1 style="font-size:22px">Cadastro de Membro</h1>
    <p class="sub">Preencha seus dados</p>
    <label>Nome completo *<input type="text" id="nome" required></label>
    <label>Telefone<input type="text" id="telefone" maxlength="16" inputmode="numeric" placeholder="(47) 99999-9999"></label>
    <label>Data de nascimento<input type="date" id="data_nascimento"></label>
    <label>Sexo
      <select id="sexo"><option value="">—</option><option value="M">Masculino</option><option value="F">Feminino</option></select>
    </label>
    <label>Bairro<input type="text" id="endereco"></label>
    <label class="check-linha"><input type="checkbox" id="consent" required> Li e aceito a <a href="privacidade.html" target="_blank" style="color:var(--accent)">Política de Privacidade</a></label>
    <button type="submit">Enviar cadastro</button>
    <p id="msg" class="erro"></p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const slug = new URLSearchParams(location.search).get('ig');
      if (!slug) { msg.className = 'erro'; msg.textContent = 'Link inválido. Peça o link de cadastro à sua igreja.'; return; }
      const r = await fetch('api/publico/cadastro-membro', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug,
          consentimento: document.getElementById('consent').checked,
          nome: document.getElementById('nome').value,
          telefone: document.getElementById('telefone').value,
          data_nascimento: document.getElementById('data_nascimento').value || null,
          sexo: document.getElementById('sexo').value || null,
          endereco: document.getElementById('endereco').value,
        }),
      });
      const d = await r.json();
      if (r.ok) {
        document.getElementById('f').reset();
        msg.className = 'ok-msg'; msg.textContent = '✓ Cadastro enviado! Obrigado.';
      } else { msg.className = 'erro'; msg.textContent = d.erro || 'Erro ao enviar'; }
    });

    // Máscara de telefone (padrão BR)
    const tel = document.getElementById('telefone');
    tel.addEventListener('input', () => {
      let d = tel.value.replace(/\D/g, '').slice(0, 11);
      tel.value = d.length === 0 ? ''
        : d.length <= 2 ? '(' + d
        : d.length <= 6 ? `(${d.slice(0,2)}) ${d.slice(2)}`
        : d.length <= 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`
        : `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    });
  </script>
</body>
</html>
