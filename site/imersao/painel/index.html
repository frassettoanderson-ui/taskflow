<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#070708" />
  <title>Painel · Imersão Bravos</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../img/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Oswald:wght@500;600&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#070708; --stone:#0f0e10; --panel:#151317; --line:rgba(255,255,255,.09);
      --gold:#D9AC45; --gold-hi:#F2D16B; --cream:#F4EEE2; --muted:#8d867a;
      --ok:#4ea86a; --warn:#c9822f; --bad:#b8402a;
    }
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--ink);color:#cfc8ba;font-family:'Barlow',system-ui,sans-serif;font-weight:300;font-size:16px}
    a{color:var(--gold)}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

    header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
    header img{width:46px;height:46px;object-fit:contain}
    header h1{margin:0;font-family:'Cinzel',serif;font-weight:700;font-size:1.35rem;letter-spacing:.06em;color:var(--cream)}
    header .sub{font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
    header .acoes{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:4px;
      font-family:'Oswald',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:1.4px;text-transform:uppercase;
      text-decoration:none;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold);transition:.2s}
    .btn:hover{background:rgba(217,172,69,.1)}
    .btn-ouro{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#B98728);color:#141006;border-color:transparent}
    .btn-ouro:hover{filter:brightness(1.08)}
    .btn[disabled]{opacity:.5;pointer-events:none}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:26px}
    .card{background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
    .card b{display:block;font-family:'Oswald',sans-serif;font-weight:600;font-size:2rem;line-height:1.1;color:var(--cream)}
    .card span{display:block;margin-top:4px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .card.ok b{color:var(--ok)} .card.warn b{color:var(--warn)} .card.gold b{color:var(--gold)}

    .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .barra input{flex:1;min-width:200px;padding:11px 14px;border-radius:4px;border:1px solid var(--line);
      background:var(--panel);color:var(--cream);font-family:inherit;font-size:.95rem}
    .barra input::placeholder{color:#6d6659}
    .barra input:focus{outline:none;border-color:var(--gold)}
    .abas{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
    .aba{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border:0;background:transparent;cursor:pointer;
      font-family:'Oswald',sans-serif;font-weight:500;font-size:.82rem;letter-spacing:1.2px;text-transform:uppercase;
      color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.18s}
    .aba:hover{color:var(--cream)}
    .aba.on{color:var(--gold);border-bottom-color:var(--gold)}
    .aba i{font-style:normal;min-width:22px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);
      font-size:.74rem;color:inherit}
    .aba.on i{background:rgba(217,172,69,.16)}
    .aba[data-f="pagos"].on{color:#7cc994;border-bottom-color:#7cc994}
    .aba[data-f="pagos"].on i{background:rgba(78,168,106,.18)}
    .aba[data-f="pendentes"].on{color:#e0a45c;border-bottom-color:#e0a45c}
    .aba[data-f="pendentes"].on i{background:rgba(201,130,47,.18)}
    .aba[data-f="recusados"].on{color:#e08872;border-bottom-color:#e08872}
    .aba[data-f="recusados"].on i{background:rgba(184,64,42,.18)}

    .tabela{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--stone)}
    table{width:100%;border-collapse:collapse;font-size:.92rem}
    th{background:var(--panel);text-align:left;padding:13px 14px;font-family:'Oswald',sans-serif;font-weight:500;
      font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
    td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:middle}
    tbody tr:hover{background:rgba(255,255,255,.02)}
    td.nome{color:var(--cream);font-weight:500}
    th.ord,td.ord{width:52px;text-align:center;padding-left:8px;padding-right:8px}
    td.ord{font-family:'Oswald',sans-serif;font-weight:500;color:var(--gold);font-size:.9rem}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.74rem;
      font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
    .t-pago{background:rgba(78,168,106,.14);color:#7cc994}
    .t-pend{background:rgba(201,130,47,.14);color:#e0a45c}
    .t-neg{background:rgba(184,64,42,.14);color:#e08872}
    .t-sim{background:rgba(78,168,106,.14);color:#7cc994}
    .t-nao{background:rgba(184,64,42,.14);color:#e08872}
    .zap{color:var(--gold);text-decoration:none;font-size:.8rem;white-space:nowrap;border-bottom:1px solid rgba(217,172,69,.35)}
    .mini{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:4px;cursor:pointer;
      border:1px solid var(--gold);background:transparent;color:var(--gold);white-space:nowrap;
      font-family:'Oswald',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.9px;text-transform:uppercase;transition:.18s}
    .mini:hover{background:rgba(217,172,69,.12)}
    .mini[disabled]{opacity:.55;pointer-events:none}
    .lapis{border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
      width:32px;height:32px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:.18s}
    .lapis:hover{border-color:var(--gold);color:var(--gold)}
    .lapis svg{width:15px;height:15px}
    td.acoes{white-space:nowrap;text-align:right}
    td.acoes>*+*{margin-left:6px}
    .msg{font-size:.76rem;color:var(--muted)}
    .msg.erro{color:#e08872}
    .msg.ok{color:#7cc994}
    .fundo{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}
    .fundo[hidden]{display:none}
    .caixa{width:min(420px,100%);background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:26px}
    .caixa h3{margin:0 0 4px;font-family:'Cinzel',serif;font-size:1.1rem;color:var(--cream)}
    .caixa p.quem{margin:0 0 18px;font-size:.85rem;color:var(--muted)}
    .caixa label{display:block;font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:1.2px;
      text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
    .caixa input{width:100%;padding:11px 13px;border-radius:4px;border:1px solid var(--line);
      background:var(--panel);color:var(--cream);font-family:inherit;font-size:.95rem}
    .caixa input:focus{outline:none;border-color:var(--gold)}
    .caixa .fim{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
    .vazio{padding:44px 20px;text-align:center;color:var(--muted)}
    .aviso{margin-bottom:18px;padding:13px 16px;border-radius:6px;border:1px solid rgba(201,130,47,.35);
      background:rgba(201,130,47,.08);color:#e0a45c;font-size:.9rem}
    .rodape{margin-top:16px;font-size:.8rem;color:var(--muted);text-align:center}

    @media (max-width:720px){
      .wrap{padding:20px 14px 70px}
      header .acoes{width:100%;margin-left:0}
      table{font-size:.86rem}
      th,td{padding:11px 10px}
      .esconde{display:none}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../img/logo-bravos-gold.png" alt="" />
      <div>
        <h1>Painel de Inscritos</h1>
        <div class="sub" id="sub">Imersão Bravos · 17.10.2026</div>
      </div>
      <div class="acoes">
        <button class="btn" id="atualizar">Atualizar</button>
        <a class="btn btn-ouro" id="csv" href="#">Baixar planilha</a>
      </div>
    </header>

    <div id="alerta" class="aviso" hidden></div>

    <div class="cards" id="cards"></div>

    <div class="abas" id="abas">
      <button class="aba on" data-f="pagos">Pagos <i id="c-pagos">0</i></button>
      <button class="aba" data-f="pendentes">Pendentes <i id="c-pendentes">0</i></button>
      <button class="aba" data-f="recusados">Recusados <i id="c-recusados">0</i></button>
      <button class="aba" data-f="fora">Fora do grupo <i id="c-fora">0</i></button>
      <button class="aba" data-f="todos">Todos <i id="c-todos">0</i></button>
    </div>

    <div class="barra">
      <input id="busca" type="search" placeholder="Buscar por nome, WhatsApp ou e-mail…" />
    </div>

    <div class="tabela">
      <table>
        <thead>
          <tr>
            <th class="ord">#</th>
            <th>Nome</th>
            <th>WhatsApp</th>
            <th class="esconde">E-mail</th>
            <th>Pagamento</th>
            <th>No grupo</th>
            <th class="esconde">Inscrito em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="linhas"><tr><td colspan="8" class="vazio">Carregando…</td></tr></tbody>
      </table>
    </div>

    <p class="rodape" id="rodape"></p>
  </div>

  <div class="fundo" id="editor" hidden>
    <div class="caixa">
      <h3>Editar inscrito</h3>
      <p class="quem" id="ed-quem"></p>
      <label for="ed-nome">Nome</label>
      <input id="ed-nome" type="text" />
      <label for="ed-fone">WhatsApp (com DDD)</label>
      <input id="ed-fone" type="tel" inputmode="numeric" placeholder="48999999999" />
      <p class="msg erro" id="ed-erro" hidden></p>
      <div class="fim">
        <button class="btn" id="ed-cancelar">Cancelar</button>
        <button class="btn btn-ouro" id="ed-salvar">Salvar</button>
      </div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
let KEY = params.get('key') || localStorage.getItem('bravos_key') || '';
if (params.get('key')) { localStorage.setItem('bravos_key', KEY); history.replaceState(null,'',location.pathname); }

let dados = null, filtro = 'pagos', termo = '';

const fone = w => {
  const d = String(w||'').replace(/\D/g,'').replace(/^55/,'');
  return d.length >= 10 ? `(${d.slice(0,2)}) ${d.slice(2,-4)}-${d.slice(-4)}` : (w||'');
};
const zap = w => 'https://wa.me/55' + String(w||'').replace(/\D/g,'').replace(/^55/,'');
const dataBr = s => { if(!s) return '—'; const d=new Date(s);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const real = n => 'R$ ' + Number(n||0).toFixed(2).replace('.',',');

async function carregar(forcar) {
  if (!KEY) { KEY = prompt('Chave de acesso do painel:') || ''; if (KEY) localStorage.setItem('bravos_key', KEY); }
  if (!KEY) return;
  const btn = $('#atualizar'); btn.disabled = true; btn.textContent = 'Atualizando…';
  try {
    const r = await fetch(`../api/painel?key=${encodeURIComponent(KEY)}${forcar ? '&atualizar=1' : ''}`);
    if (r.status === 401) { localStorage.removeItem('bravos_key'); KEY=''; alerta('Chave inválida. Recarregue a página e informe a chave correta.'); return; }
    dados = await r.json();
    $('#csv').href = `../api/admin?key=${encodeURIComponent(KEY)}&csv=1`;
    render();
  } catch (e) { alerta('Não consegui carregar os dados: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Atualizar'; }
}

function alerta(msg){ const a=$('#alerta'); a.textContent=msg; a.hidden=!msg; }

function render() {
  if (!dados) return;
  const { resumo, grupo, inscritos } = dados;

  alerta(grupo ? '' : 'Não consegui ler o grupo do WhatsApp agora — a coluna "No grupo" fica indisponível. Os pagamentos continuam corretos.');
  $('#sub').textContent = grupo ? `Imersão Bravos · grupo "${grupo.nome}" · ${grupo.total} no grupo` : 'Imersão Bravos · 17.10.2026';

  $('#cards').innerHTML = `
    <div class="card ok"><b>${resumo.pagos}</b><span>Inscrições pagas</span></div>
    <div class="card gold"><b>${real(resumo.arrecadado)}</b><span>Arrecadado</span></div>
    <div class="card ok"><b>${resumo.noGrupo}</b><span>Pagos no grupo</span></div>
    <div class="card warn"><b>${resumo.foraGrupo}</b><span>Pagos fora do grupo</span></div>
    <div class="card"><b>${resumo.pendentes}</b><span>Pagamentos pendentes</span></div>`;

  // contadores das abas
  const cont = {
    pagos: inscritos.filter(r => r.status === 'approved').length,
    pendentes: inscritos.filter(r => r.status === 'pending').length,
    recusados: inscritos.filter(r => r.status !== 'approved' && r.status !== 'pending').length,
    fora: inscritos.filter(r => r.status === 'approved' && r.noGrupo === false).length,
    todos: inscritos.length,
  };
  for (const k in cont) { const el = document.getElementById('c-' + k); if (el) el.textContent = cont[k]; }

  let lista = inscritos;
  if (filtro === 'pagos') lista = lista.filter(r => r.status === 'approved');
  if (filtro === 'pendentes') lista = lista.filter(r => r.status === 'pending');
  if (filtro === 'recusados') lista = lista.filter(r => r.status !== 'approved' && r.status !== 'pending');
  if (filtro === 'fora') lista = lista.filter(r => r.status === 'approved' && r.noGrupo === false);
  if (termo) {
    const t = termo.toLowerCase(), td = termo.replace(/\D/g,'');
    lista = lista.filter(r => (r.nome||'').toLowerCase().includes(t) || (r.email||'').toLowerCase().includes(t)
      || (td && String(r.whatsapp||'').includes(td)));
  }

  const tagPag = s => s === 'approved' ? '<span class="tag t-pago">Pago</span>'
    : s === 'pending' ? '<span class="tag t-pend">Pendente</span>'
    : `<span class="tag t-neg">${s === 'rejected' ? 'Recusado' : s}</span>`;
  const tagGrupo = r => r.noGrupo === true
    ? '<span class="tag t-sim">Sim</span>'
    : '<button class="mini" data-add="' + r.id + '">Adicionar no grupo</button>';
  const LAPIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

  $('#linhas').innerHTML = lista.length ? lista.map(r => `
    <tr>
      <td class="ord">${r.ordem}</td>
      <td class="nome">${esc(r.nome)}</td>
      <td>${fone(r.whatsapp)}</td>
      <td class="esconde">${esc(r.email)}</td>
      <td>${tagPag(r.status)}</td>
      <td id="g-${r.id}">${tagGrupo(r)}</td>
      <td class="esconde">${dataBr(r.criado)}</td>
      <td class="acoes">
        ${r.noGrupo === true ? '' : `<a class="zap" target="_blank" rel="noopener" href="${zap(r.whatsapp)}?text=${encodeURIComponent(convite(r.nome))}">Convite</a>`}
        <button class="lapis" data-edit="${r.id}" title="Editar">${LAPIS}</button>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="vazio">Nenhum registro com esse filtro.</td></tr>';

  $('#rodape').textContent = `${lista.length} de ${inscritos.length} registros · atualizado ${new Date().toLocaleTimeString('pt-BR')}`;
}

function convite(nome){
  const p = String(nome||'').split(' ')[0];
  return `Olá ${p}! Sua inscrição na Imersão Bravos está confirmada. ✅\n\nEntre no grupo dos inscritos pra receber os avisos até o dia 17/10:\n${(dados?.grupo?.link)||''}`;
}
const esc = s => String(s==null?'':s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// adicionar ao grupo + abrir editor
$('#linhas').addEventListener('click', async e => {
  const add = e.target.closest('[data-add]');
  const ed  = e.target.closest('[data-edit]');
  if (ed) return abrirEditor(ed.dataset.edit);
  if (!add) return;

  const cel = document.getElementById('g-' + add.dataset.add);
  add.disabled = true; add.textContent = 'Adicionando...';
  try {
    const r = await fetch('../api/grupo/adicionar?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: add.dataset.add }),
    });
    const d = await r.json();
    const recados = {
      privacidade: 'Privacidade do WhatsApp bloqueia - use Convite',
      saiu_recente: 'Saiu do grupo ha pouco - use Convite',
      bloqueou: 'Numero indisponivel - confira o telefone',
      falhou: 'Nao consegui adicionar - use Convite',
    };
    if (d.ok) { cel.innerHTML = '<span class="tag t-sim">Sim</span>'; setTimeout(() => carregar(true), 1500); }
    else cel.innerHTML = '<span class="msg erro">' + esc(recados[d.resultado] || d.error || 'Falhou') + '</span>';
  } catch (err) { cel.innerHTML = '<span class="msg erro">Erro de conexao</span>'; }
});

// editor de inscrito
let editando = null;
function abrirEditor(id) {
  const r = (dados && dados.inscritos || []).find(x => x.id === id); if (!r) return;
  editando = id;
  $('#ed-quem').textContent = r.email || '';
  $('#ed-nome').value = r.nome || '';
  $('#ed-fone').value = r.whatsapp || '';
  $('#ed-erro').hidden = true;
  $('#editor').hidden = false;
  $('#ed-fone').focus();
}
const fecharEditor = () => { $('#editor').hidden = true; editando = null; };
$('#ed-cancelar').addEventListener('click', fecharEditor);
$('#editor').addEventListener('click', e => { if (e.target.id === 'editor') fecharEditor(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#editor').hidden) fecharEditor(); });

$('#ed-salvar').addEventListener('click', async () => {
  const fone = $('#ed-fone').value.replace(/\D/g, '');
  const erro = $('#ed-erro');
  if (fone.replace(/^55/, '').length < 10) {
    erro.textContent = 'Telefone invalido - informe DDD + numero.'; erro.hidden = false; return;
  }
  const b = $('#ed-salvar'); b.disabled = true; b.textContent = 'Salvando...';
  try {
    const r = await fetch('../api/inscrito/' + editando + '?key=' + encodeURIComponent(KEY), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ whatsapp: fone, nome: $('#ed-nome').value }),
    });
    const d = await r.json();
    if (!r.ok) { erro.textContent = d.error || 'Nao consegui salvar.'; erro.hidden = false; return; }
    fecharEditor(); carregar(true);
  } catch (e) { erro.textContent = 'Erro de conexao.'; erro.hidden = false; }
  finally { b.disabled = false; b.textContent = 'Salvar'; }
});

$('#atualizar').addEventListener('click', () => carregar(true));
$('#busca').addEventListener('input', e => { termo = e.target.value.trim(); render(); });
$('#abas').addEventListener('click', e => {
  const b = e.target.closest('.aba'); if (!b) return;
  document.querySelectorAll('.aba').forEach(c => c.classList.toggle('on', c === b));
  filtro = b.dataset.f; render();
});

carregar();
setInterval(() => carregar(false), 60000);
</script>
</body>
</html>
